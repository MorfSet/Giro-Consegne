<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#16232E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Giro Consegne</title>
<style>
  :root{
    --ink:#16232E; --ink-soft:#4A5A68; --bg:#EDF0F3; --card:#FFFFFF;
    --cargo:#F5B301; --cargo-ink:#3D2E00; --ok:#2E7D4F; --warn:#C0392B;
    --line:#D5DBE1; --radius:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; font-size:16px;}
  body{padding-bottom:76px;}
  header{background:var(--ink); color:#fff; padding:14px 16px 12px;
    position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:10px;}
  header .badge{background:var(--cargo); color:var(--cargo-ink); font-weight:800;
    border-radius:8px; padding:4px 8px; font-size:13px; letter-spacing:.5px;}
  header h1{font-size:18px; margin:0; font-weight:700; letter-spacing:.3px;}
  main{padding:14px; max-width:640px; margin:0 auto;}

  /* Bottom nav */
  nav{position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:1px solid var(--line);
    display:flex; z-index:30;}
  nav button{flex:1; border:0; background:none; padding:10px 4px 12px; font-size:12px;
    color:var(--ink-soft); font-weight:600; display:flex; flex-direction:column; align-items:center; gap:3px;}
  nav button .ic{font-size:22px; line-height:1;}
  nav button.active{color:var(--ink);}
  nav button.active .ic{filter:none;}
  nav button.active::after{content:""; width:28px; height:3px; border-radius:2px; background:var(--cargo); margin-top:2px;}

  .card{background:var(--card); border-radius:var(--radius); padding:14px;
    box-shadow:0 1px 3px rgba(22,35,46,.08); margin-bottom:12px;}
  .row{display:flex; gap:10px; align-items:center;}
  .grow{flex:1; min-width:0;}
  .muted{color:var(--ink-soft); font-size:14px;}
  .small{font-size:13px;}
  h2{font-size:16px; margin:4px 0 10px; text-transform:uppercase; letter-spacing:1px; color:var(--ink-soft);}

  button.btn{border:0; border-radius:12px; padding:13px 16px; font-size:16px; font-weight:700;
    background:var(--ink); color:#fff; width:100%; margin-top:8px;}
  button.btn.cargo{background:var(--cargo); color:var(--cargo-ink);}
  button.btn.ghost{background:#fff; color:var(--ink); border:1.5px solid var(--line);}
  button.btn.danger{background:#fff; color:var(--warn); border:1.5px solid var(--warn);}
  button.btn.sm{width:auto; padding:9px 12px; font-size:14px; margin-top:0;}
  button:active{transform:scale(.98);}

  input[type=text],input[type=tel],textarea,select{
    width:100%; border:1.5px solid var(--line); border-radius:10px; padding:12px;
    font-size:16px; background:#fff; color:var(--ink); font-family:inherit;}
  textarea{min-height:70px; resize:vertical;}
  label{font-size:13px; font-weight:700; color:var(--ink-soft); display:block; margin:10px 0 4px;
    text-transform:uppercase; letter-spacing:.5px;}

  /* Client card */
  .client{display:flex; gap:12px; align-items:center;}
  .thumb{width:58px; height:58px; border-radius:10px; background:var(--bg); flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:24px; overflow:hidden;
    border:1px solid var(--line);}
  .thumb img{width:100%; height:100%; object-fit:cover;}
  .client .name{font-weight:700; font-size:16px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .client .addr{font-size:13px; color:var(--ink-soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .flag{display:inline-block; font-size:11px; font-weight:800; padding:2px 7px; border-radius:6px; margin-top:3px;}
  .flag.warn{background:#FBE4E1; color:var(--warn);}
  .flag.gps{background:#E2F0E8; color:var(--ok);}
  .flag.nogps{background:#F0F0F0; color:var(--ink-soft);}

  /* History */
  .hist{border-left:3px solid var(--line); padding:8px 0 8px 12px; margin-left:6px;}
  .hist.problema{border-color:var(--warn);}
  .hist.ok{border-color:var(--ok);}
  .hist .when{font-size:12px; color:var(--ink-soft); font-weight:700;}
  .hist p{margin:3px 0 0; font-size:15px; white-space:pre-wrap;}

  /* Route stops — waybill style */
  .stop{display:flex; gap:12px; align-items:flex-start; position:relative; padding:10px 0;}
  .stop .num{width:34px; height:34px; border-radius:50%; background:var(--cargo); color:var(--cargo-ink);
    font-weight:800; display:flex; align-items:center; justify-content:center; flex-shrink:0; z-index:1;}
  .stop.start .num{background:var(--ink); color:#fff; font-size:15px;}
  .stop:not(:last-child)::before{content:""; position:absolute; left:16px; top:44px; bottom:-10px;
    border-left:2px dashed var(--cargo);}
  .stop .dist{font-size:12px; color:var(--ink-soft); font-weight:700;}

  .checkline{display:flex; align-items:center; gap:12px; padding:11px 4px; border-bottom:1px solid var(--line);}
  .checkline:last-child{border-bottom:0;}
  .checkline input{width:22px; height:22px; accent-color:var(--cargo); flex-shrink:0;}

  /* Modal */
  .modal{position:fixed; inset:0; background:rgba(22,35,46,.55); z-index:50; display:none;
    align-items:flex-end; justify-content:center;}
  .modal.open{display:flex;}
  .sheet{background:var(--bg); width:100%; max-width:640px; max-height:92vh; overflow-y:auto;
    border-radius:18px 18px 0 0; padding:16px 14px 24px;}
  .sheet .handle{width:44px; height:5px; border-radius:3px; background:var(--line); margin:0 auto 12px;}
  .photo-big{width:100%; max-height:220px; object-fit:cover; border-radius:12px; margin-bottom:8px;}
  .empty{text-align:center; padding:36px 16px; color:var(--ink-soft);}
  .empty .ic{font-size:44px; display:block; margin-bottom:8px;}
  .toast{position:fixed; bottom:88px; left:50%; transform:translateX(-50%); background:var(--ink);
    color:#fff; padding:10px 18px; border-radius:10px; font-size:14px; font-weight:600; z-index:99;
    opacity:0; transition:opacity .25s; pointer-events:none; white-space:nowrap;}
  .pthumb{width:70px;height:70px;object-fit:cover;border-radius:8px;margin:4px 4px 0 0;border:1px solid var(--line);}
  .pthumb.exp{width:100%;height:auto;}
  .stopdone{background:#EAF6EF;border-radius:10px;padding:8px !important;margin:4px 0;}
  .stopprob{background:#FBEAE7;border-radius:10px;padding:8px !important;margin:4px 0;}
  .stbadge{display:inline-block;font-size:11px;font-weight:800;padding:2px 8px;border-radius:6px;color:#fff;letter-spacing:.5px;}
  .lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:80;display:none;
    align-items:center;justify-content:center;flex-direction:column;padding:12px;}
  .lightbox.open{display:flex;}
  .lightbox img{max-width:100%;max-height:82vh;object-fit:contain;border-radius:10px;}
  .lightbox .cap{color:#fff;font-weight:700;margin-top:10px;text-align:center;font-size:15px;}
  .lightbox .cls{position:absolute;top:14px;right:16px;background:rgba(255,255,255,.15);color:#fff;
    border:0;border-radius:50%;width:40px;height:40px;font-size:22px;font-weight:800;}
  .lightbox .nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.15);
    color:#fff;border:0;border-radius:50%;width:44px;height:44px;font-size:22px;font-weight:800;}
  .toast.show{opacity:1;}
  .searchbar{position:relative; margin-bottom:12px;}
  .searchbar input{padding-left:38px;}
  .searchbar::before{content:"🔍"; position:absolute; left:12px; top:12px; font-size:15px;}
  @media (prefers-reduced-motion: reduce){ *{transition:none !important;} }
</style>
</head>
<body>

<header>
  <span class="badge">GIRO</span>
  <h1 id="headerTitle">Consegne</h1>
  <span id="buildTag" style="margin-left:auto;font-size:11px;opacity:.55;font-weight:600;"></span>
</header>

<main id="main"></main>

<nav>
  <button id="nav-clienti" onclick="go('clienti')"><span class="ic">📦</span>Clienti</button>
  <button id="nav-giro" onclick="go('giro')"><span class="ic">🗺️</span>Giro</button>
  <button id="nav-storico" onclick="go('storico')"><span class="ic">📅</span>Storico</button>
  <button id="nav-backup" onclick="go('backup')"><span class="ic">💾</span>Backup</button>
</nav>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="lightbox" id="lightbox" onclick="closeLightbox(event)">
  <button class="cls" onclick="closeLightbox(event,1)">×</button>
  <button class="nav" style="left:10px;" onclick="lbStep(event,-1)">‹</button>
  <button class="nav" style="right:10px;" onclick="lbStep(event,1)">›</button>
  <img id="lbImg" src="" alt="">
  <div class="cap" id="lbCap"></div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============ IndexedDB ============ */
let db;
function openDB(){
  return new Promise((res,rej)=>{
    const r = indexedDB.open('giroconsegne', 2);
    r.onupgradeneeded = e=>{
      const d = e.target.result;
      if(!d.objectStoreNames.contains('clients')) d.createObjectStore('clients',{keyPath:'id'});
      if(!d.objectStoreNames.contains('routes'))  d.createObjectStore('routes',{keyPath:'id'});
      if(!d.objectStoreNames.contains('meta'))    d.createObjectStore('meta',{keyPath:'k'});
      if(!d.objectStoreNames.contains('days'))    d.createObjectStore('days',{keyPath:'id'});
    };
    r.onsuccess = e=>{ db = e.target.result; res(); };
    r.onerror = ()=>rej(r.error);
  });
}
function tx(store, mode, fn){
  return new Promise((res,rej)=>{
    const t = db.transaction(store, mode);
    const s = t.objectStore(store);
    const out = fn(s);
    t.oncomplete = ()=>res(out && out.result !== undefined ? out.result : undefined);
    t.onerror = ()=>rej(t.error);
  });
}
const putClient = c=>tx('clients','readwrite',s=>s.put(c));
const delClient = id=>tx('clients','readwrite',s=>s.delete(id));
const putRoute  = r=>tx('routes','readwrite',s=>s.put(r));
const delRoute  = id=>tx('routes','readwrite',s=>s.delete(id));
const putDay    = d=>tx('days','readwrite',s=>s.put(d));
const delDay    = id=>tx('days','readwrite',s=>s.delete(id));
function getAll(store){
  return new Promise((res,rej)=>{
    const r = db.transaction(store).objectStore(store).getAll();
    r.onsuccess = ()=>res(r.result); r.onerror = ()=>rej(r.error);
  });
}
const uid = ()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

/* ============ State ============ */
let clients = [], routes = [], days = [], view = 'clienti', search = '', giroSearch = '';
let START = { name:'SIGENE (magazzino)', lat:38.0024144, lng:12.5401633 };

async function loadAll(){
  clients = await getAll('clients');
  routes  = await getAll('routes');
  days    = await getAll('days');
  days.sort((a,b)=>b.ts-a.ts);
  const meta = await getAll('meta');
  const s = meta.find(m=>m.k==='start');
  if(s) START = s.v;
  restoreSession(meta);
  clients.sort((a,b)=>a.name.localeCompare(b.name,'it'));
}

/* ============ Utils ============ */
const esc = s=>(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}
function haversine(a,b){
  const R=6371, dLat=(b.lat-a.lat)*Math.PI/180, dLng=(b.lng-a.lng)*Math.PI/180;
  const x = Math.sin(dLat/2)**2 + Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(x));
}
function fmtKm(k){ return k<1 ? Math.round(k*1000)+' m' : k.toFixed(1)+' km'; }
function fmtDate(ts){
  return new Date(ts).toLocaleString('it-IT',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'});
}
function hasGPS(c){ return typeof c.lat==='number' && typeof c.lng==='number'; }
function fmtWindow(c){
  if(!c.oraDa && !c.oraA) return '';
  return '⏰ ' + (c.oraDa||'…') + '–' + (c.oraA||'…');
}
function lastProblem(c){
  const h=(c.history||[]).filter(x=>x.type==='problema');
  return h.length ? h[h.length-1] : null;
}

/* Photo: resize to max 900px JPEG */
function processPhoto(file){
  return new Promise((res,rej)=>{
    const img = new Image();
    img.onload = ()=>{
      const max = 900, ratio = Math.min(1, max/Math.max(img.width,img.height));
      const cv = document.createElement('canvas');
      cv.width = Math.round(img.width*ratio); cv.height = Math.round(img.height*ratio);
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
      res(cv.toDataURL('image/jpeg',0.72));
      URL.revokeObjectURL(img.src);
    };
    img.onerror = rej;
    img.src = URL.createObjectURL(file);
  });
}

/* ============ Navigation ============ */
function go(v){
  view = v; search='';
  if(!navFromPop) history.pushState({view:v}, '');
  document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
  document.getElementById('nav-'+v).classList.add('active');
  document.getElementById('headerTitle').textContent =
    v==='clienti'?'Clienti':(v==='giro'?'Crea il giro':(v==='storico'?'Storico giri':'Backup dati'));
  render();
}

/* ============ Render: Clienti ============ */
function renderClienti(){
  const list = clients.filter(c=>{
    const q = search.toLowerCase();
    return !q || c.name.toLowerCase().includes(q) || (c.address||'').toLowerCase().includes(q);
  });
  let html = `
    <div class="searchbar"><input type="text" placeholder="Cerca cliente o via..." value="${esc(search)}"
      oninput="search=this.value; renderClientList();"></div>
    <button class="btn cargo" onclick="editClient(null)">+ Nuovo cliente</button>
    <div id="clientList" style="margin-top:12px;"></div>`;
  document.getElementById('main').innerHTML = html;
  renderClientList();
}
function renderClientList(){
  const q = search.toLowerCase();
  const list = clients.filter(c=>!q || c.name.toLowerCase().includes(q) || (c.address||'').toLowerCase().includes(q));
  const el = document.getElementById('clientList');
  if(!list.length){
    el.innerHTML = `<div class="empty"><span class="ic">📦</span>${clients.length? 'Nessun risultato.' : 'Ancora nessun cliente.<br>Aggiungi il primo con il pulsante giallo.'}</div>`;
    return;
  }
  el.innerHTML = list.map(c=>{
    const prob = lastProblem(c);
    return `<div class="card client">
      <div class="thumb" onclick="event.stopPropagation();${clientPhotos(c).length?`openLightbox('${c.id}',0)`:`editClient('${c.id}')`}">${clientPhotos(c).length?`<img src="${clientPhotos(c)[0]}" alt="">`:'🏪'}</div>
      <div class="grow" onclick="showClient('${c.id}')" style="cursor:pointer;">
        <div class="name">${esc(c.name)}</div>
        <div class="addr">${esc(c.address||'—')}</div>
        ${hasGPS(c)?'<span class="flag gps">GPS ✓</span>':'<span class="flag nogps">no GPS</span>'}
        ${fmtWindow(c)?`<span class="flag" style="background:#FFF3D6;color:#7A5800;">${fmtWindow(c)}</span>`:''}
        ${prob?`<span class="flag warn">⚠ ${esc(prob.text.slice(0,26))}${prob.text.length>26?'…':''}</span>`:''}
      </div>
      ${c.phone?`<a href="tel:${esc(c.phone)}" onclick="event.stopPropagation()" style="text-decoration:none;font-size:22px;padding:8px;background:var(--bg);border-radius:10px;">📞</a>`:''}
      ${c.agentePhone?`<a href="tel:${esc(c.agentePhone)}" onclick="event.stopPropagation()" title="Chiama agente ${esc(c.agente||'')}" style="text-decoration:none;font-size:20px;padding:8px;background:var(--bg);border-radius:10px;">👔</a>`:''}
      <div style="font-size:20px;color:var(--line);" onclick="showClient('${c.id}')">›</div>
    </div>`;
  }).join('');
}

/* ============ Client detail sheet ============ */
function openSheet(html){
  document.getElementById('sheet').innerHTML =
    '<div class="handle"></div><button class="btn ghost sm" style="margin-bottom:10px;" onclick="closeSheet()">← Indietro</button>'+html;
  document.getElementById('modal').classList.add('open');
  history.pushState({view:view, sheet:1}, '');
}
function closeSheet(){
  if(document.getElementById('modal').classList.contains('open')) history.back();
}
window.addEventListener('popstate', e=>{
  const m = document.getElementById('modal');
  if(m.classList.contains('open')){ m.classList.remove('open'); return; }
  if(e.state && e.state.view){ navFromPop = true; go(e.state.view); navFromPop = false; }
});
let navFromPop = false;
document.getElementById('modal').addEventListener('click', e=>{ if(e.target.id==='modal') closeSheet(); });

/* --- Visualizzatore foto a schermo intero --- */
let lbList = [], lbIdx = 0, lbName = '';
function openLightbox(id, i){
  const c = clients.find(x=>x.id===id); if(!c) return;
  lbList = clientPhotos(c); if(!lbList.length) return;
  lbIdx = i || 0; lbName = c.name;
  lbShow();
  document.getElementById('lightbox').classList.add('open');
}
function lbShow(){
  document.getElementById('lbImg').src = lbList[lbIdx];
  document.getElementById('lbCap').textContent =
    lbName + (lbList.length>1 ? `  (${lbIdx+1}/${lbList.length})` : '');
  const show = lbList.length>1 ? 'block' : 'none';
  document.querySelectorAll('#lightbox .nav').forEach(b=>b.style.display=show);
}
function lbStep(e, d){
  e.stopPropagation();
  lbIdx = (lbIdx + d + lbList.length) % lbList.length;
  lbShow();
}
function closeLightbox(e, force){
  if(!force && e && e.target.tagName === 'IMG') return; // tocco sull'immagine: non chiudere
  if(e) e.stopPropagation();
  document.getElementById('lightbox').classList.remove('open');
}
/* --- Galleria foto cliente --- */
function clientPhotos(c){
  // c.photos = galleria; c.photo = copertina (retrocompatibilità)
  if(Array.isArray(c.photos) && c.photos.length) return c.photos;
  return c.photo ? [c.photo] : [];
}
async function persistPhotos(c, arr){
  c.photos = arr;
  c.photo = arr[0] || null; // copertina usata nelle liste
  await putClient(c);
  await loadAll();
}
async function addClientPhotos(id, input){
  const c = clients.find(x=>x.id===id); if(!c || !input.files) return;
  const arr = clientPhotos(c).slice();
  let n = 0;
  for(const f of input.files){
    try{ arr.push(await processPhoto(f)); n++; }catch(e){}
  }
  input.value = '';
  if(!n) return;
  await persistPhotos(c, arr);
  showClient(id); render();
  toast(n>1 ? `${n} foto aggiunte` : 'Foto aggiunta');
}
async function delClientPhoto(id, i){
  const c = clients.find(x=>x.id===id); if(!c) return;
  if(!confirm('Eliminare questa foto?')) return;
  const arr = clientPhotos(c).slice();
  arr.splice(i,1);
  await persistPhotos(c, arr);
  showClient(id); render();
}
async function setCover(id, i){
  const c = clients.find(x=>x.id===id); if(!c) return;
  const arr = clientPhotos(c).slice();
  const [p] = arr.splice(i,1);
  arr.unshift(p);
  await persistPhotos(c, arr);
  showClient(id); render();
  toast('Copertina aggiornata');
}
function showClient(id){
  const c = clients.find(x=>x.id===id); if(!c) return;
  const hist = (c.history||[]).slice().reverse();
  const gallery = clientPhotos(c);
  openSheet(`

    <div class="card">
      <div style="font-size:19px;font-weight:800;">${esc(c.name)}</div>
      <div class="muted">${esc(c.address||'')}</div>
      ${fmtWindow(c)?`<div style="margin-top:6px;font-weight:700;color:#7A5800;">${fmtWindow(c)} ricezione merce</div>`:''}
      ${c.phone?`<div style="margin-top:8px;"><a href="tel:${esc(c.phone)}" style="color:var(--ink);font-weight:700;">📞 ${esc(c.phone)}</a></div>`:''}
      ${c.agente||c.agentePhone?`<div style="margin-top:8px;padding:8px 10px;background:var(--bg);border-radius:10px;">
        <div class="small" style="font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-soft);">Agente</div>
        <div class="row" style="margin-top:2px;">
          <div class="grow" style="font-weight:700;">${esc(c.agente||'—')}</div>
          ${c.agentePhone?`<a href="tel:${esc(c.agentePhone)}" class="btn ghost sm" style="text-decoration:none;text-align:center;">📞 Chiama agente</a>`:''}
        </div>
      </div>`:''}
      ${c.notes?`<div style="margin-top:8px;white-space:pre-wrap;">${esc(c.notes)}</div>`:''}
      <div class="row" style="margin-top:12px;gap:8px;">
        <button class="btn ghost sm grow" onclick="editClient('${c.id}')">✏️ Modifica</button>
        ${hasGPS(c)?`<button class="btn ghost sm grow" onclick="window.open('https://www.google.com/maps/dir/?api=1&destination=${c.lat},${c.lng}&travelmode=driving')">🧭 Naviga</button>`
          :(c.address?`<button class="btn ghost sm grow" onclick="window.open('https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(c.address)}&travelmode=driving')">🧭 Naviga</button>`:'')}
      </div>
    </div>
    <div class="card">
      <h2>Nuova nota</h2>
      <select id="noteType">
        <option value="nota">📝 Nota</option>
        <option value="problema">⚠️ Problema</option>
        <option value="ok">✅ Consegna OK</option>
      </select>

function parsePaste(txt){
  const st = document.getElementById('pasteStatus');
  txt = (txt||'').trim();
  try{ txt = decodeURIComponent(txt); }catch(e){ /* link con % non validi: uso il testo così com'è */ }
  if(!txt){ st.textContent=''; return; }
  let lat=null, lng=null, m, viewport=false;
  // 1) Pin del luogo: !3d..!4d.. — è la posizione VERA del negozio (prendo l'ultima occorrenza)
  const pins = [...txt.matchAll(/!3d(-?\d{1,3}\.\d+)!4d(-?\d{1,3}\.\d+)/g)];
  if(pins.length){ m = pins[pins.length-1]; lat=+m[1]; lng=+m[2]; }
  // 2) Parametri espliciti: q= query= ll= destination=
  else if((m = txt.match(/[?&](?:q|query|ll|destination)=(-?\d{1,3}\.\d+)\s*,\s*(-?\d{1,3}\.\d+)/))) { lat=+m[1]; lng=+m[2]; }
  // 3) Coordinate pure incollate: "38.08764, 12.65915"
  else if((m = txt.match(/^(-?\d{1,3}\.\d+)[\s,;]+(-?\d{1,3}\.\d+)$/))) { lat=+m[1]; lng=+m[2]; }
  // 4) Ultima spiaggia: @lat,lng = centro della mappa, NON il negozio
  else if((m = txt.match(/@(-?\d{1,3}\.\d+),(-?\d{1,3}\.\d+)/))) { lat=+m[1]; lng=+m[2]; viewport=true; }
  if(lat!==null && Math.abs(lat)<=90 && Math.abs(lng)<=180){
    document.getElementById('f_lat').value = lat;
    document.getElementById('f_lng').value = lng;
    if(viewport){
      st.style.color = '#B8860B';
      st.textContent = `⚠ Letta la posizione del CENTRO mappa (${lat.toFixed(5)}, ${lng.toFixed(5)}). Se non era centrata sul negozio, meglio: tocco lungo sul punto → copia coordinate → incolla qui.`;
    } else {
      st.style.color = 'var(--ok)';
      st.textContent = `✓ Coordinate lette: ${lat.toFixed(5)}, ${lng.toFixed(5)}`;
    }
  } else if(/goo\.gl|maps\.app/.test(txt)){
    const url = (txt.match(/https?:\/\/\S+/)||[txt])[0];
    st.style.color = 'var(--warn)';
    st.innerHTML = '✗ I link abbreviati non contengono le coordinate. ' +
      `<button class="btn ghost sm" style="margin-top:6px;" onclick="window.open('${url.replace(/'/g,'')}','_blank')">🌍 Apri questo link in Maps</button>` +
      '<div class="muted small" style="margin-top:4px;">Poi: tocco lungo sul pin rosso → tocca le coordinate in alto → copia → incolla qui.</div>';
  } else {
    st.style.color = 'var(--warn)';
    st.textContent = '✗ Formato non riconosciuto. Esempio valido: 38.08764, 12.65915';
  }
}

function setStartHere(){

  }, ()=>toast('GPS non disponibile'));

/* Nearest neighbour + 2-opt */
function optimize(points){
  if(points.length<=1) return points;
  let route=[], pool=[...points], cur=START;
  while(pool.length){
    let bi=0, bd=Infinity;
    pool.forEach((p,i)=>{ const d=haversine(cur,p); if(d<bd){bd=d;bi=i;} });
    cur = pool.splice(bi,1)[0]; route.push(cur);
  }
  // 2-opt
  const dist = r=>{
    let t=haversine(START,r[0]);
    for(let i=0;i<r.length-1;i++) t+=haversine(r[i],r[i+1]);
    return t;
  };
  let improved=true;
  while(improved){
    improved=false;
    for(let i=0;i<route.length-1;i++){
      for(let j=i+1;j<route.length;j++){
        const alt = route.slice(0,i).concat(route.slice(i,j+1).reverse(), route.slice(j+1));
        if(dist(alt) < dist(route)-0.001){ route=alt; improved=true; }
      }
    }
  }
  return route;
}

let lastOrder = [];
/* --- Finestre orarie: parsing, simulazione ETA, riparazione ordine --- */
function parseWin(c){
  const p = t => (t && /^\d{2}:\d{2}$/.test(t)) ? (+t.slice(0,2))*60 + (+t.slice(3)) : null;
  return { da: p(c.oraDa), a: p(c.oraA) };
}
const SPEED_KMH = 25, SERVICE_MIN = 8;
function nowMin(){ const d=new Date(); return d.getHours()*60 + d.getMinutes(); }
function fmtMin(m){ m=Math.round(m)%1440; return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'); }
function simulate(route, startT){
  let t = startT, prev = START;
  return route.map(c=>{
    const d = hasGPS(c) ? haversine(prev,c) : 1.5;
    t += d/(SPEED_KMH/60);
    const w = parseWin(c);
    let wait = 0, late = false;
    if(w.da!==null && t < w.da){ wait = w.da - t; t = w.da; }
    if(w.a!==null && t > w.a) late = true;
    const eta = t;
    t += SERVICE_MIN;
    if(hasGPS(c)) prev = c;
    return {eta, wait, late};
  });
}
const countLate = sim => sim.filter(x=>x.late).length;
const sumWait  = sim => sim.reduce((a,x)=>a+x.wait,0);
function repairForWindows(route){
  // Sposta in avanti le tappe che arriverebbero fuori orario, finché migliora
  for(let guard=0; guard<route.length*3; guard++){
    const sim = simulate(route, nowMin());
    const li = sim.findIndex(x=>x.late);
    if(li <= 0) break;
    const alt = route.slice();
    [alt[li-1], alt[li]] = [alt[li], alt[li-1]];
    const sim2 = simulate(alt, nowMin());
    const better = countLate(sim2) < countLate(sim) ||
      (countLate(sim2) === countLate(sim) && sumWait(sim2) <= sumWait(sim));
    if(better){ route.splice(0, route.length, ...alt); } else break;
  }
  return route;
}
function buildRoute(){
  const sel = clients.filter(c=>selected.has(c.id));
  if(!sel.length){ toast('Seleziona almeno una consegna'); return; }
  const withGPS = sel.filter(hasGPS), noGPS = sel.filter(c=>!hasGPS(c));
  lastOrder = repairForWindows(optimize(withGPS)).concat(noGPS); // no-GPS in coda
  saveSession();
  renderRouteResult(noGPS.length);
}
function renderRouteResult(noGpsCount, restored){
  let cum=0, prev=START;
  const sim = simulate(lastOrder, nowMin());
  const stopsHtml = lastOrder.map((c,i)=>{
    let leg='';
    if(hasGPS(c)){ const d=haversine(prev,c); cum+=d; leg=fmtKm(d); prev=c; }
    const s = sim[i], w = parseWin(c);
    return `<div class="stop">
      <div class="num">${i+1}</div>
      ${clientPhotos(c).length?`<img src="${clientPhotos(c)[0]}" onclick="openLightbox('${c.id}',0)" class="pthumb" style="width:46px;height:46px;margin:0 8px 0 0;">`:''}
      <div class="grow">
        <div onclick="showClient('${c.id}')" style="font-weight:700;text-decoration:underline dotted var(--line);cursor:pointer;">${esc(c.name)}</div>
        <div class="muted small">${esc(c.address||'')}</div>
        ${fmtWindow(c)?`<div class="dist" style="color:#7A5800;">${fmtWindow(c)} ricezione · arrivo stimato ~${fmtMin(s.eta)}</div>`:''}
        ${s.wait>1?`<div class="dist" style="color:#7A5800;">⏳ attesa di ~${Math.round(s.wait)} min (apre alle ${fmtMin(w.da)})</div>`:''}
        ${s.late?`<div class="dist" style="color:var(--warn);font-weight:800;">⚠ FUORI ORARIO: riceve fino alle ${fmtMin(w.a)}, arrivo stimato ${fmtMin(s.eta)}</div>`:''}
        ${leg?`<div class="dist">↑ ${leg} dalla tappa precedente</div>`:'<div class="dist">⚠ senza GPS — messa in coda</div>'}
      </div>
      ${c.phone?`<a href="tel:${esc(c.phone)}" style="text-decoration:none;font-size:20px;padding:6px;background:var(--bg);border-radius:10px;align-self:center;">📞</a>`:''}
    </div>`;
  }).join('');

  document.getElementById('routeResult').innerHTML = `
    <div class="card" style="margin-top:12px;">
      <h2>Ordine di consegna · ~${fmtKm(cum)} totali</h2>
      <div class="muted small" style="margin-bottom:6px;">Orari stimati partendo adesso (${fmtMin(nowMin())}), ~${SERVICE_MIN} min a tappa e ${SPEED_KMH} km/h medi — indicativi. Le finestre orarie che hai impostato vengono rispettate nell'ordine.</div>
      <div class="stop start"><div class="num">S</div>
        <div class="grow"><div style="font-weight:700;">${esc(START.name)}</div><div class="muted small">Partenza</div></div>
      </div>
      ${stopsHtml}
      ${noGpsCount?`<div class="muted small" style="margin-top:6px;">⚠ ${noGpsCount} tappe senza GPS: salvane la posizione la prossima volta che ci passi, e verranno ottimizzate anche loro.</div>`:''}
      <button class="btn cargo" onclick="startDay()">▶️ Avvia giro (traccia le consegne)</button>
      <button class="btn" onclick="openInMaps()">🧭 Apri percorso in Google Maps</button>
      <button class="btn ghost" onclick="saveCurrentRoute()">💾 Salva come giro ricorrente</button>

  if(!restored) document.getElementById('routeResult').scrollIntoView({behavior:'smooth'});

function openInMaps(){
  if(!lastOrder.length) return;
  const pt = c=> hasGPS(c) ? `${c.lat},${c.lng}` : encodeURIComponent(c.address||c.name);
  const stops = lastOrder.slice(0, 10); // limite waypoints Maps
  if(lastOrder.length>10) toast('Maps accetta max 10 tappe: aperte le prime 10');
  const dest = pt(stops[stops.length-1]);
  const way = stops.slice(0,-1).map(pt).join('|');
  let url = `https://www.google.com/maps/dir/?api=1&origin=${START.lat},${START.lng}&destination=${dest}&travelmode=driving`;
  if(way) url += `&waypoints=${way}`;
  window.open(url,'_blank');
}

async function startDay(){
  if(!lastOrder.length){ toast('Prima calcola il giro'); return; }
  const d = {
    id: uid(), ts: Date.now(),
    date: new Date().toLocaleDateString('it-IT',{weekday:'short', day:'2-digit', month:'2-digit', year:'numeric'}),
    stops: lastOrder.map(c=>({clientId:c.id, name:c.name, status:'pending', note:''}))
  };
  await putDay(d);
  selected = new Set(); lastOrder = []; await saveSession();
  await loadAll();
  go('storico');
  toast('Giro avviato: segna le consegne man mano');
}
function dayStatus(d){
  const st = d.stops.map(s=>s.status);
  if(st.some(s=>s==='problema')) return {ic:'🔴', label:'Con problemi', color:'var(--warn)'};
  if(st.every(s=>s==='ok'))      return {ic:'🟢', label:'Tutto OK', color:'var(--ok)'};
  return {ic:'🟡', label:'In corso / incompleto', color:'#B8860B'};
}
let openDayId = null;
function renderStorico(){
  if(!days.length){
    document.getElementById('main').innerHTML =
      '<div class="empty"><span class="ic">📅</span>Nessun giro tracciato.<br>Calcola un giro e premi <b>▶️ Avvia giro</b>.</div>';
    return;
  }
  if(openDayId===null) openDayId = days[0].id;
  document.getElementById('main').innerHTML = days.map(d=>{
    const st = dayStatus(d);
    const open = d.id===openDayId;
    const done = d.stops.filter(s=>s.status!=='pending').length;
    return `<div class="card">
      <div class="row" style="cursor:pointer;" onclick="openDayId=${open?'null':`'${d.id}'`}; renderStorico();">
        <div style="font-size:26px;">${st.ic}</div>
        <div class="grow">
          <div style="font-weight:800;">${esc(d.date)}</div>
          <div class="muted small">${done}/${d.stops.length} consegne · <b style="color:${st.color}">${st.label}</b></div>
        </div>
        <div style="font-size:18px;color:var(--line);">${open?'▾':'▸'}</div>
      </div>
      ${open ? `<div style="margin-top:10px;border-top:1px solid var(--line);padding-top:6px;">
        ${d.stops.map((s,i)=>{
          const cl = clients.find(x=>x.id===s.clientId);
          const nav = cl ? (hasGPS(cl) ? `https://www.google.com/maps/dir/?api=1&destination=${cl.lat},${cl.lng}&travelmode=driving`
                        : (cl.address ? `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(cl.address)}&travelmode=driving` : '')) : '';
          const rowCls = s.status==='ok' ? 'stopdone' : s.status==='problema' ? 'stopprob' : '';
          const badge = s.status==='ok' ? '<span class="stbadge" style="background:var(--ok);">CONSEGNATA ✓</span>'
                      : s.status==='problema' ? '<span class="stbadge" style="background:var(--warn);">PROBLEMA ⚠</span>' : '';
          return `
          <div class="checkline ${rowCls}" style="align-items:flex-start;">
            <div style="font-weight:800;width:22px;">${i+1}.</div>
            ${cl&&clientPhotos(cl).length?`<img src="${clientPhotos(cl)[0]}" onclick="openLightbox('${cl.id}',0)" class="pthumb" style="width:52px;height:52px;margin:0 8px 0 0;">`:''}
            <div class="grow">
              <div ${cl?`onclick="showClient('${cl.id}')" style="font-weight:700;text-decoration:underline dotted var(--line);cursor:pointer;"`:'style="font-weight:700;"'}>${esc(s.name)} ${badge}</div>
              ${cl&&fmtWindow(cl)?`<div class="muted small" style="color:#7A5800;font-weight:700;">${fmtWindow(cl)} ricezione</div>`:''}
              <div class="muted small" style="margin-top:2px;">Ora prevista: <input type="time" value="${esc(s.eta||'')}" onchange="setEta('${d.id}',${i},this.value)" style="width:auto;padding:4px 8px;font-size:14px;border:1.5px solid var(--line);border-radius:8px;"></div>
              ${s.note?`<div class="muted small" style="margin-top:4px;">⚠ ${esc(s.note)}</div>`:''}
              ${(s.photos&&s.photos.length)?`<div>${s.photos.map(p=>`<img class="pthumb" src="${p}" onclick="this.classList.toggle('exp')">`).join('')}</div>`:''}
              <div class="row" style="gap:6px;margin-top:6px;flex-wrap:wrap;">
                ${s.status==='pending'?`
                <button class="btn ghost sm" style="border-color:var(--ok);color:var(--ok);" onclick="setStop('${d.id}',${i},'ok')">Consegnata</button>
                <button class="btn ghost sm" style="border-color:var(--warn);color:var(--warn);" onclick="setStop('${d.id}',${i},'problema')">Problema</button>

                <button class="btn ghost sm" onclick="moveStop('${d.id}',${i},1)">▼</button>

async function setStop(dayId, idx, status){
  if(status==='problema'){ openProblem(dayId, idx); return; }
  const d = days.find(x=>x.id===dayId); if(!d) return;
  const s = d.stops[idx];
  s.status = status; s.note=''; s.photos=[];
  await putDay(d);
  await loadAll(); openDayId = dayId; renderStorico();
}
async function moveStop(dayId, idx, dir){
  const d = days.find(x=>x.id===dayId); if(!d) return;
  const j = idx + dir;
  if(j < 0 || j >= d.stops.length) return;
  [d.stops[idx], d.stops[j]] = [d.stops[j], d.stops[idx]];
  await putDay(d);
  await loadAll(); openDayId = dayId; renderStorico();
}
async function setEta(dayId, idx, val){
  const d = days.find(x=>x.id===dayId); if(!d) return;
  d.stops[idx].eta = val;
  await putDay(d);
  toast('Ora prevista salvata');
}

    probPhotos.map((p,i)=>`<span style="position:relative;display:inline-block;">

async function saveProblem(dayId, idx){
  const d = days.find(x=>x.id===dayId); if(!d) return;
  const s = d.stops[idx];
  const text = document.getElementById('probText').value.trim() || 'Problema segnalato';
  s.status = 'problema'; s.note = text; s.photos = probPhotos.slice();
  const c = clients.find(x=>x.id===s.clientId);
  if(c){ (c.history=c.history||[]).push({ts:Date.now(), type:'problema', text, photos:s.photos}); await putClient(c); }
  await putDay(d);
  closeSheet();
  await loadAll(); openDayId = dayId; renderStorico();
  toast('Problema registrato' + (s.photos.length?` con ${s.photos.length} foto`:''));
}

function exportData(){
  const blob = new Blob([JSON.stringify({v:2, exported:Date.now(), start:START, clients, routes, days})],{type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'giro-consegne-backup-' + new Date().toISOString().slice(0,10) + '.json';
  a.click(); URL.revokeObjectURL(a.href);
  toast('Backup scaricato');
}
async function importData(input){
  if(!input.files || !input.files[0]) return;
  try{
    const data = JSON.parse(await input.files[0].text());
    for(const c of (data.clients||[])) await putClient(c);
    for(const r of (data.routes||[])) await putRoute(r);
    for(const d of (data.days||[])) await putDay(d);
    if(data.start) { START=data.start; await tx('meta','readwrite',s=>s.put({k:'start',v:START})); }
    await loadAll(); render();
    toast('Backup importato ✓');
  }catch(e){ toast('File non valido'); }
}

async function migrateAgents(){
  const meta = await getAll('meta');
  if(meta.some(m=>m.k==='agents_v1')) return;
  const all = await getAll('clients');
  for(const c of all){
    const mm = (c.agente||'').trim().match(/^(\d{3})\b/);
    if(mm && AGENTS[mm[1]]){
      if((c.agente||'').trim() === mm[1]) c.agente = mm[1] + ' ' + AGENTS[mm[1]][0];
      if(!c.agentePhone) c.agentePhone = AGENTS[mm[1]][1];

    }
  }
  await tx('meta','readwrite',s=>s.put({k:'agents_v1', v:true}));
}
